<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Segmento Mock Wallet Events</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: 28px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 24px;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    button {
      min-height: 44px;
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #059669;
    }

    button.secondary:hover {
      background: #047857;
    }

    dl {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px 14px;
      margin: 0 0 20px;
      padding: 16px;
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #020617;
      font-size: 13px;
    }

    dt {
      color: #94a3b8;
    }

    dd {
      margin: 0;
      overflow-wrap: anywhere;
      color: #e5e7eb;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
    }

    pre {
      min-height: 92px;
      margin: 0;
      padding: 14px;
      overflow: auto;
      border: 1px solid #1f2937;
      border-radius: 8px;
      background: #020617;
      color: #bfdbfe;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    @media (max-width: 520px) {
      main {
        padding: 22px;
      }

      .actions,
      dl {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Segmento Mock Wallet Events</h1>
    <p>Buttons below send mock wallet tracking events to the staging referral API.</p>

    <div class="actions">
      <button id="connect-btn" type="button">Mock Connect Wallet</button>
      <button id="transaction-btn" class="secondary" type="button">Mock Send Transaction</button>
    </div>

    <dl>
      <dt>Base URL</dt>
      <dd id="base-url"></dd>
      <dt>Project</dt>
      <dd id="project"></dd>
      <dt>Wallet</dt>
      <dd id="wallet"></dd>
    </dl>

    <pre id="log">Ready.</pre>
  </main>

  <script type="module">
    import { SegmentoClient, getReferralCode } from "../../packages/core/dist/index.js";

    const TOKEN = "eyJ2IjoxLCJwaWQiOiJ0ZXN0LXByb2plY3QiLCJuYW1lIjoiVGVzdCBQcm9qZWN0IiwiY2hrIjoiYzQwOTZhNDUifQ";
    // example sends events to staging, not necessary to set in production
    const BASE_URL = "https://staging-referral.segmento.tech/manager-api";
    const MOCK_WALLET_ADDRESS = "MockWallet111111111111111111111111111111111";

    const client = SegmentoClient.init(TOKEN, { baseUrl: BASE_URL });
    const referralCode = getReferralCode() ?? undefined;

    const logEl = document.getElementById("log");
    document.getElementById("base-url").textContent = BASE_URL;
    document.getElementById("project").textContent = `${client.projectName} (${client.projectId})`;
    document.getElementById("wallet").textContent = MOCK_WALLET_ADDRESS;

    function writeLog(label, payload) {
      logEl.textContent = `${label}\n${JSON.stringify(payload, null, 2)}`;
    }

    document.getElementById("connect-btn").addEventListener("click", () => {
      const payload = {
        walletAddress: MOCK_WALLET_ADDRESS,
        referralCode,
        meta: {
          source: "mock-wallet-events-example",
          wallet_provider: "mock",
          connected_at: new Date().toISOString(),
        },
      };

      client.trackWalletConnect(payload);
      writeLog("Sent wallet-connect event", payload);
    });

    document.getElementById("transaction-btn").addEventListener("click", () => {
      const payload = {
        walletAddress: MOCK_WALLET_ADDRESS,
        referralCode,
        meta: {
          tx: "0x12345"
        },
      };

      client.trackWalletTransaction(payload);
      writeLog("Sent wallet-transaction event", payload);
    });
  </script>
</body>

</html>
