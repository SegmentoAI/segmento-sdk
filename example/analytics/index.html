<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Segmento Analytics — Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@segmento/analytics@0.4.0/dist/script.js" data-project-id="test-project"
    data-api-url="https://staging-referral.segmento.tech/-/v1"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 48px 16px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 4px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin: 0 0 28px;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    button {
      padding: 11px 20px;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #6d28d9;
    }

    .log-label {
      font-size: 12px;
      color: #555;
      margin-bottom: 6px;
    }

    .log {
      background: #111;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      font-family: monospace;
      color: #aaa;
      min-height: 80px;
      white-space: pre-wrap;
    }

    .entry {
      color: #4ade80;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Analytics Demo</h1>
    <p class="subtitle">
      A <code>pageview</code> is sent automatically on load.
      Click the button to fire a custom <code>button_click</code> event.
    </p>

    <div class="row">
      <button id="btn">Send button_click</button>
    </div>

    <div class="log-label">Events sent</div>
    <div class="log" id="log"></div>
  </div>

  <script>
    const logEl = document.getElementById("log");
    const entries = [];

    function append(line) {
      entries.push(line);
      logEl.innerHTML = entries
        .map((e) => `<span class="entry">${e}</span>`)
        .join("\n");
    }

    append("pageview  →  " + location.href);

    document.getElementById("btn").addEventListener("click", () => {
      segmentoTag("button_click", { label: "demo button" });
      append('custom    →  button_click  { label: "demo button" }');
    });
  </script>
</body>

</html>
